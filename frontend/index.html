<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>GRC Deploy - Management Tool</title>
</head>
<body class="h-screen w-screen flex flex-col bg-slate-950 text-slate-200 font-sans">

    <!-- CONTAINER SUPERIOR (Sidebar + Conteúdo) -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- SIDEBAR -->
        <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between shadow-2xl z-10">
            <!-- Logo Area -->
            <div class="p-6 border-b border-slate-800 flex items-center space-x-3">
                <img id="logo" class="w-8 h-8" src="./src/assets/images/logo-universal.png" alt="logo"/>
                <div>
                    <h1 class="font-bold text-lg text-slate-100 tracking-wider">GRC<span class="text-cyan-500">DEPLOY</span></h1>
                    <p class="text-xs text-slate-500 font-mono">v1.2.0-core</p>
                </div>
            </div>

            <!-- Menu de Navegação -->
            <nav class="flex-1 p-4 space-y-2" id="sidebar-nav">
                <!-- Botão Ativo (Exemplo: Dashboard) -->
                <button class="w-full flex items-center space-x-3 px-4 py-3 bg-slate-800 text-cyan-400 border border-slate-700 rounded-lg shadow-inner transition-all">
                    <!-- Ícone SVG inline (Lucide Grid) -->
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                    <span class="font-semibold tracking-wide text-sm">Dashboard</span>
                </button>

                <!-- Botão Inativo (Exemplo: Módulos) -->
                <button class="w-full flex items-center space-x-3 px-4 py-3 bg-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 rounded-lg transition-all duration-200 ease-in-out hover:-translate-y-0.5">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                    <span class="font-semibold tracking-wide text-sm">Módulos Isolados</span>
                </button>
            </nav>
        </aside>

        <!-- ÁREA PRINCIPAL DE CONTEÚDO -->
        <main class="flex-1 bg-slate-950 p-8 overflow-y-auto relative" id="main-content">
            <!-- Título da View -->
            <header class="mb-8">
                <h2 class="text-2xl font-bold text-slate-100">Visão Geral</h2>
                <p class="text-sm text-slate-400 mt-1">Selecione uma esteira de automação ou inicie componentes individualmente.</p>
            </header>

            <!-- AQUI ENTRARÃO OS CARDS DE SOFTWARE (Injetados via TS depois) -->
            <div id="view-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Placeholder visual para entendermos o espaço -->
                <div class="h-48 border border-slate-800 border-dashed rounded-xl flex items-center justify-center text-slate-600 font-mono text-sm">
                    [ ÁREA DE CARDS DINÂMICOS ]
                </div>
            </div>
        </main>
    </div>

    <!-- TERMINAL / CONSOLE INFERIOR -->
    <footer class="h-48 bg-[#05080f] border-t border-slate-800 flex flex-col z-20">
        <!-- Barra de título do terminal -->
        <div class="px-4 py-2 bg-slate-900 border-b border-slate-800 flex justify-between items-center select-none">
            <span class="text-xs font-mono text-slate-500 uppercase flex items-center space-x-2">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                <span>Console de Operações</span>
            </span>
            <button class="text-slate-500 hover:text-slate-300 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </button>
        </div>
        <!-- Área de logs rolável -->
        <div id="terminal-output" class="flex-1 p-4 font-mono text-sm text-slate-400 overflow-y-auto space-y-1">
            <div class="flex items-start space-x-3 text-cyan-500">
                <span class="text-slate-600">[19:20:08]</span>
                <span>[INFO] GRC Deploy Interface inicializada. Aguardando comandos...</span>
            </div>
        </div>
    </footer>

    <!-- Modal Root: Base escura de sobreposição -->
    <div id="modal-root" class="fixed inset-0 bg-black/80 z-50 hidden items-center justify-center backdrop-blur-sm"></div>

    <!-- Template Dinâmico: Kaspersky Wizard -->
    <template id="kaspersky-wizard-template">
      <div class="w-125 bg-slate-900 border border-emerald-500/30 rounded-xl shadow-2xl shadow-emerald-900/10 flex flex-col overflow-hidden animate-fade-in-up">
        <div class="px-6 py-4 border-b border-slate-800 bg-slate-900 flex justify-between items-center">
            <h2 class="text-lg font-bold text-slate-100 flex items-center space-x-2">
                <svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                <span>Kaspersky Deploy Ops</span>
            </h2>
        </div>
        <div class="wizard-content p-6 space-y-4 text-sm text-slate-300">
            <!-- Os inputs e menus entram aqui via TS -->
        </div>
        <div class="px-6 py-4 border-t border-slate-800 bg-slate-950 flex justify-end space-x-3">
            <button class="btn-cancel px-4 py-2 rounded-lg font-medium text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition-colors">Cancelar</button>
            <button class="btn-next px-4 py-2 rounded-lg font-medium bg-emerald-600 text-white hover:bg-emerald-500 transition-colors">Avançar</button>
        </div>
      </div>
    </template>

<!-- Template Dinâmico: WPS Wizard -->
    <template id="wps-wizard-template">
      <div class="w-125 bg-slate-900 border border-amber-500/30 rounded-xl shadow-2xl shadow-amber-900/10 flex flex-col overflow-hidden animate-fade-in-up">
        <div class="px-6 py-4 border-b border-slate-800 bg-slate-900 flex justify-between items-center">
            <h2 class="text-lg font-bold text-slate-100 flex items-center space-x-2">
                <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"></path></svg>
                <span>WPS Office Ops</span>
            </h2>
        </div>
        <div class="wizard-content p-6 space-y-4 text-sm text-slate-300">
            <!-- Os inputs e menus entram aqui via TS -->
        </div>
        <div class="px-6 py-4 border-t border-slate-800 bg-slate-950 flex justify-end space-x-3">
            <button class="btn-cancel px-4 py-2 rounded-lg font-medium text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition-colors">Cancelar</button>
            <button class="btn-next px-4 py-2 rounded-lg font-medium bg-amber-600 text-white hover:bg-amber-500 transition-colors">Avançar</button>
        </div>
      </div>
    </template>

    <!-- Template Dinâmico: Gemco Financeiro Wizard -->
    <template id="gemco-financeiro-wizard-template">
      <div class="w-125 bg-slate-900 border border-cyan-500/30 rounded-xl shadow-2xl shadow-cyan-900/10 flex flex-col overflow-hidden animate-fade-in-up">
        <div class="px-6 py-4 border-b border-slate-800 bg-slate-900 flex justify-between items-center">
            <h2 class="text-lg font-bold text-slate-100 flex items-center space-x-2">
                <svg class="w-5 h-5 text-cyan-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m-3-2.818.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"></path></svg>
                <span>Gemco Financeiro Ops</span>
            </h2>
        </div>
        <div class="wizard-content p-6 space-y-4 text-sm text-slate-300">
            <!-- Os inputs e menus entram aqui via TS -->
        </div>
        <div class="px-6 py-4 border-t border-slate-800 bg-slate-950 flex justify-end space-x-3">
            <button class="btn-cancel px-4 py-2 rounded-lg font-medium text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition-colors">Cancelar</button>
            <button class="btn-next px-4 py-2 rounded-lg font-medium bg-cyan-600 text-white hover:bg-cyan-500 transition-colors">Avançar</button>
        </div>
      </div>
    </template>

    <!-- Template Dinâmico: SoftwareCard (Dark Tech Corporativo) -->
    <template id="software-card-template">
      <div class="software-card flex flex-col p-5 rounded-xl bg-slate-900 border border-slate-800 cursor-pointer transition-all duration-300 transform hover:-translate-y-1 hover:shadow-lg active:translate-y-0 active:shadow-inner">
        <div class="flex items-center space-x-4 mb-3">
          <div class="card-icon-container w-12 h-12 flex items-center justify-center rounded-lg bg-slate-800/50 transition-colors duration-300">
            <!-- O SVG será injetado dinamicamente via TypeScript -->
          </div>
          <h3 class="card-title text-lg font-bold text-slate-200"></h3>
        </div>
        <p class="card-description text-sm text-slate-400 grow"></p>
        
        <!-- Área de Ações/Status (Opcional, pronta para expandir) -->
        <div class="mt-4 flex justify-end card-actions">
          <span class="card-status text-xs font-medium px-2 py-1 rounded border border-slate-700 bg-slate-800 text-slate-500 opacity-0 transition-opacity duration-300"></span>
        </div>
      </div>
    </template>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
